enabled: true

# Independent from simulate/config.yaml domain_id (Unitree SDK2 domain 0).
# This is set explicitly on the ROS context, overriding shell ROS_DOMAIN_ID.
ros_domain_id: 10
clock_publish_rate: 100.0

# Ground-truth floating-base state, reusing the ROS context in domain 10.
# Pose uses MuJoCo world coordinates named "odom"; twist uses the joint's body frame.
odometry:
  enabled: true
  free_joint: floating_base_joint
  topic: /odom
  frame_id: odom
  publish_rate: 50.0
  publish_tf: true

cameras:
  - name: front_camera
    enabled: true
    publish_rate: 15.0
    frame_id: front_camera_optical_frame
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    info_topic: /camera/camera_info

# Upstream regular ray grid with MID-360 FOV; not its non-repetitive scan pattern.
# Angles are in radians. XYZ only, one simulation timestamp per cloud.
lidars:
  - name: mid360
    site: mid360
    enabled: true
    frame_id: mid360_frame
    topic: /lidar/points
    publish_rate: 10.0
    resolution: [1000, 20]
    azimuth_range: [-3.141592653589793, 3.141592653589793]
    elevation_range: [-0.122173047639603, 0.907571211037051]
    range_min: 0.1
    range_max: 40.0
    # Environment (0) and collision shapes (3), excluding visual-only meshes (2).
    # An empty list includes all geom groups.
    geom_groups: [0, 3]
