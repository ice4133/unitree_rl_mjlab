pointcloud_to_laserscan:
  ros__parameters:
    target_frame: lidar_scan_frame
    transform_tolerance: 0.05
    queue_size: 5
    # Height/self filtering already happened in the Go2W adapter.
    min_height: -10.0
    max_height: 10.0
    angle_min: -3.141592653589793
    # Exclude the duplicate +pi endpoint and its upper-bin boundary upstream.
    angle_max: 3.141591653589793
    angle_increment: 0.008726646259971648 # 0.5 degree; 720 bins.
    scan_time: 0.1 # Metadata, not a publishing timer. Input is 10 Hz.
    range_min: 0.1
    range_max: 20.0
    use_inf: true
